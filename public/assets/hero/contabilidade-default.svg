<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="1080"/>
    <line x1="800" y1="0" x2="800" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>

  <!-- Bar chart decorative element (bottom-right) -->
  <g transform="translate(1350, 500)" opacity="0.08">
    <rect x="0" y="180" width="60" height="200" rx="4" fill="#10B981"/>
    <rect x="80" y="120" width="60" height="260" rx="4" fill="#10B981"/>
    <rect x="160" y="60" width="60" height="320" rx="4" fill="#10B981"/>
    <rect x="240" y="140" width="60" height="240" rx="4" fill="#10B981"/>
    <rect x="320" y="20" width="60" height="360" rx="4" fill="#10B981"/>
  </g>

  <!-- Pie chart decorative (top-left) -->
  <g transform="translate(200, 200)" opacity="0.06">
    <circle cx="120" cy="120" r="120" fill="none" stroke="#10B981" stroke-width="40" stroke-dasharray="250 503"/>
    <circle cx="120" cy="120" r="120" fill="none" stroke="#64748b" stroke-width="40" stroke-dasharray="150 603" stroke-dashoffset="-250"/>
    <circle cx="120" cy="120" r="120" fill="none" stroke="#0ea5e9" stroke-width="40" stroke-dasharray="100 653" stroke-dashoffset="-400"/>
  </g>

  <!-- Calculator icon (center-left) -->
  <g transform="translate(100, 550)" opacity="0.05">
    <rect width="200" height="280" rx="16" fill="#94a3b8"/>
    <rect x="20" y="20" width="160" height="60" rx="8" fill="#0f172a"/>
    <circle cx="50" cy="120" r="15" fill="#0f172a"/>
    <circle cx="100" cy="120" r="15" fill="#0f172a"/>
    <circle cx="150" cy="120" r="15" fill="#0f172a"/>
    <circle cx="50" cy="170" r="15" fill="#0f172a"/>
    <circle cx="100" cy="170" r="15" fill="#0f172a"/>
    <circle cx="150" cy="170" r="15" fill="#0f172a"/>
    <circle cx="50" cy="220" r="15" fill="#0f172a"/>
    <circle cx="100" cy="220" r="15" fill="#0f172a"/>
    <rect x="130" y="205" width="40" height="60" rx="8" fill="#10B981" opacity="0.5"/>
  </g>

  <!-- Rising line chart (top-right) -->
  <g transform="translate(1400, 100)" opacity="0.06">
    <polyline points="0,250 80,200 160,220 240,150 320,170 400,80 480,30" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
    <circle cx="480" cy="30" r="8" fill="#10B981"/>
  </g>

  <!-- Dollar signs scattered -->
  <text x="600" y="300" font-family="serif" font-size="120" fill="#10B981" opacity="0.04">$</text>
  <text x="1100" y="800" font-family="serif" font-size="90" fill="#10B981" opacity="0.03">$</text>
  <text x="1600" y="400" font-family="serif" font-size="70" fill="#10B981" opacity="0.03">%</text>

  <!-- Decorative numbers -->
  <text x="800" y="900" font-family="monospace" font-size="40" fill="#64748b" opacity="0.04">1.250.000,00</text>
  <text x="400" y="150" font-family="monospace" font-size="30" fill="#64748b" opacity="0.03">R$ 985.432,17</text>

  <!-- Subtle gradient overlay for depth -->
  <rect width="1920" height="1080" fill="url(#accent)"/>
</svg>
